  <defs>
    <style>
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #252321; letter-spacing: 0.5px; }
      .text-sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 10px; font-weight: 400; fill: #808080; }
      .text-badge { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 9px; font-weight: 700; }
      .card-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 8.5px; font-weight: 600; fill: rgba(255,255,255,0.75); letter-spacing: 0.8px; }
      .card-meta { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 9px; font-weight: 500; fill: rgba(255,255,255,0.82); }
    </style>

    <!-- Gradiente Cartão 1: Inter Débito (Laranja Oficial Inter) -->
    <linearGradient id="gradInterDebito" x1="0" y1="0" x2="291" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="60%" stop-color="#F26500"/>
      <stop offset="100%" stop-color="#C84B00"/>
    </linearGradient>

    <!-- Gradiente Cartão 2: Inter Crédito (Graphite Black / Carbon) -->
    <linearGradient id="gradInterCredito" x1="0" y1="0" x2="291" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B303C"/>
      <stop offset="55%" stop-color="#1C2029"/>
      <stop offset="100%" stop-color="#101218"/>
    </linearGradient>

    <!-- Gradiente Cartão 3: Flash Benefícios (Pink / Magenta Vibrante) -->
    <linearGradient id="gradFlash" x1="0" y1="0" x2="291" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1F8F"/>
      <stop offset="55%" stop-color="#D60B72"/>
      <stop offset="100%" stop-color="#8A064B"/>
    </linearGradient>

    <!-- Gradiente Cartão 4: Wise Internacional (Forest Green & Neon Lime) -->
    <linearGradient id="gradWise" x1="0" y1="0" x2="291" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E4620"/>
      <stop offset="55%" stop-color="#132F15"/>
      <stop offset="100%" stop-color="#0B1E0D"/>
    </linearGradient>

    <!-- Gradiente Chip Metálico Dourado -->
    <linearGradient id="gradChipGold" x1="0" y1="0" x2="32" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F6C445"/>
      <stop offset="100%" stop-color="#D49B1A"/>
    </linearGradient>

    <!-- Gradiente Chip Metálico Prateado -->
    <linearGradient id="gradChipSilver" x1="0" y1="0" x2="32" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
