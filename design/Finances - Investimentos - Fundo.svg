<svg width="1280" height="1380" viewBox="0 0 1280 1380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Fundo Geral -->
  <rect width="1280" height="1380" fill="#E9E9E9"/>

  <!-- ================= HEADER (h=60) & PÍLULA DE FILTROS EXPANDIDA ================= -->
  <rect width="1280" height="60" fill="#3A3633"/>
  <rect x="15" y="13.5" width="33" height="33" rx="8" fill="#3B89E2"/>
  <text x="31.5" y="36" text-anchor="middle" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">$</text>
  <text x="58" y="28" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5px">PERSONAL FINANCES BI</text>
  <text x="58" y="45" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="10" font-weight="400" fill="#B8B4B0">INVESTIMENTOS • ALOCAÇÃO DE CARTEIRA, INDEXADORES (CDI / PTAX) &amp; RENTABILIDADE</text>

  <!-- Container pílula ampliado (w=570, h=46) -->
  <rect x="695" y="7" width="570" height="46" rx="10" fill="#252321" stroke="#4D4845" stroke-width="1"/>
  <path d="M712 24H724L719.5 29.5V34.5L716.5 36V29.5L712 24Z" stroke="#3B89E2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="734" y="33.5" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="9" font-weight="700" fill="#A09D9A" letter-spacing="0.4px">PERÍODO:</text>
  <line x1="990" y1="14" x2="990" y2="46" stroke="#4D4845" stroke-width="1"/>
  <text x="1004" y="33.5" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="9" font-weight="700" fill="#A09D9A" letter-spacing="0.4px">ATIVO:</text>

  <!-- ================= LINHA 1: FUNDOS DOS 4 KPI CARDS (y=70, h=85) ================= -->
  <rect x="15" y="70" width="301" height="85" rx="14" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="331" y="70" width="301" height="85" rx="14" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="647" y="70" width="301" height="85" rx="14" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="964" y="70" width="301" height="85" rx="14" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- ================= LINHA 2: FUNDO ALOCAÇÃO (HTML) + FLUXO MENSAL (NATIVO) (y=170, h=430) ================= -->
  <!-- Esquerda: Fundo branco da seção Alocação por Ativo -->
  <rect x="15" y="170" width="412" height="430" rx="15" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Direita: Fluxo Mensal de Aportes vs Resgates (Visual Nativo) -->
  <rect x="442" y="170" width="823" height="430" rx="15" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="458" y="184" width="10" height="10" rx="3" fill="#10715A"/>
  <text x="474" y="193" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="11.5" font-weight="700" fill="#252321" letter-spacing="0.4px">FLUXO MENSAL: APORTES × RESGATES × APORTE LÍQUIDO</text>
  <rect x="1164" y="179" width="85" height="20" rx="10" fill="#DCFCE7"/>
  <text x="1206.5" y="192" text-anchor="middle" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="8" font-weight="700" fill="#10715A">NET FLOW</text>
  <text x="458" y="210" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="9.5" font-weight="400" fill="#808080">Evolução mensal das aplicações brutas, saques/realocações e retenção líquida de capital</text>
  <line x1="458" y1="220" x2="1249" y2="220" stroke="#F0F0F0" stroke-width="1"/>

  <!-- ================= LINHA 3: POSIÇÕES DA CARTEIRA (TABELA NATIVA) (y=615, h=400) ================= -->
  <rect x="15" y="615" width="1250" height="400" rx="15" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="31" y="629" width="10" height="10" rx="3" fill="#1E3A5F"/>
  <text x="47" y="638" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="11.5" font-weight="700" fill="#252321" letter-spacing="0.4px">POSIÇÕES DA CARTEIRA &amp; DETALHAMENTO POR ATIVO</text>
  <rect x="1144" y="624" width="105" height="20" rx="10" fill="#DCFCE7"/>
  <text x="1196.5" y="637" text-anchor="middle" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="8" font-weight="700" fill="#10715A">CARTEIRA ATIVA</text>
  <text x="31" y="655" font-family="'DIN', 'Bahnschrift', sans-serif" font-size="9.5" font-weight="400" fill="#808080">Consolidação de aportes brutos, resgates, saldo líquido retido, participação percentual e frequência de aportes</text>
  <line x1="31" y1="665" x2="1249" y2="665" stroke="#F0F0F0" stroke-width="1"/>

  <!-- ================= LINHA 4: FUNDOS DOS 3 CARDS INFERIORES (y=1030, h=320) ================= -->
  <rect x="15" y="1030" width="410" height="320" rx="15" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="440" y="1030" width="408" height="320" rx="15" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="863" y="1030" width="402" height="320" rx="15" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1" filter="url(#cardShadow)"/>
</svg>
